<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="container">
      <section class="login-card" aria-labelledby="login-title">
        <div class="card-glow"></div>
        <h1 id="login-title">Welcome back</h1>
        <p class="subtitle">Sign in to continue your journey.</p>

        <form id="login-form" novalidate>
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>

          <label class="field">
            <span>Password</span>
            <div class="password-wrap">
              <input type="password" name="password" placeholder="••••••••" minlength="6" required />
              <button type="button" id="toggle-password" aria-label="Show password">👁</button>
            </div>
          </label>

          <div class="row">
            <label class="remember">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>
            <a href="#" class="link">Forgot password?</a>
          </div>

          <button id="submit-btn" type="submit">
            <span class="btn-text">Sign in</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <p id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="footer">No account? <a href="#" class="link">Create one</a></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
